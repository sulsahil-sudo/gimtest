<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دوري روشن السعودي - المباريات والترتيب والهدافين</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 950px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1b4d3e; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 20px; font-size: 14px; }
        
        /* الأزرار */
        .nav-buttons { display: flex; justify-content: center; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; }
        .btn { background-color: #e0e0e0; color: #333; border: none; padding: 10px 16px; font-size: 14px; font-weight: bold; border-radius: 25px; cursor: pointer; transition: 0.3s; }
        .btn.active { background-color: #1b4d3e; color: white; box-shadow: 0 4px 10px rgba(27, 77, 62, 0.3); }
        .btn:hover { background-color: #14382c; color: white; }

        /* الأقسام */
        .section { display: none; }
        .section.active { display: block; }

        /* الجداول والبطاقات */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #e1e4e8; padding: 10px; text-align: center; font-size: 14px; }
        th { background-color: #1b4d3e; color: white; }
        tr:nth-child(even) { background-color: #f9fbfb; }
        tr:hover { background-color: #f1f5f5; }
        
        .match-card { background: #fdfefe; border: 1px solid #e1e4e8; border-radius: 8px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        
        .team-box { display: flex; align-items: center; justify-content: center; gap: 10px; width: 35%; }
        .team-badge { width: 38px; height: 38px; background: #1b4d3e; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); border: 2px solid #d4af37; }
        .team-name { font-weight: bold; color: #1b4d3e; font-size: 15px; }
        
        .score-box { font-size: 18px; font-weight: bold; color: #1b4d3e; background: #e8f5e9; padding: 5px 15px; border-radius: 20px; }
        
        .countdown-container { display: flex; justify-content: center; gap: 4px; align-items: center; }
        .time-box { background-color: #1b4d3e; color: white; padding: 5px 8px; border-radius: 6px; text-align: center; min-width: 40px; font-size: 11px; font-weight: bold; }
        .time-box span { display: block; font-size: 14px; }
        .time-separator { font-weight: bold; color: #1b4d3e; font-size: 14px; }

        .match-date-badge { font-size: 11px; color: #555; background: #f1f2f6; padding: 3px 8px; border-radius: 4px; margin-bottom: 6px; display: inline-block; font-weight: bold; }
        .no-match { text-align: center; color: #666; padding: 20px; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <h1>⚽ دوري روشن السعودي للمحترفين</h1>
    <div class="subtitle">المباريات، الترتيب، وهدافو الدوري</div>

    <!-- الأزرار -->
    <div class="nav-buttons">
        <button id="btnYesterday" class="btn" onclick="switchTab('yesterday')">⏪ الأمس</button>
        <button id="btnToday" class="btn active" onclick="switchTab('today')">⚡ اليوم</button>
        <button id="btnTomorrow" class="btn" onclick="switchTab('tomorrow')">⏩ بكره</button>
        <button id="btnStandings" class="btn" onclick="switchTab('standings')">📊 الترتيب</button>
        <button id="btnScorers" class="btn" onclick="switchTab('scorers')">🏆 الهدافون</button>
    </div>

    <!-- الأقسام -->
    <div id="yesterdaySection" class="section">
        <h3 style="color: #1b4d3e; text-align: right;">مباريات الأمس:</h3>
        <div id="yesterdayList"></div>
    </div>

    <div id="todaySection" class="section active">
        <h3 style="color: #1b4d3e; text-align: right;">مباريات اليوم:</h3>
        <div id="todayList"></div>
    </div>

    <div id="tomorrowSection" class="section">
        <h3 style="color: #1b4d3e; text-align: right;">مباريات بكره:</h3>
        <div id="tomorrowList"></div>
    </div>

    <div id="standingsSection" class="section">
        <h3 style="color: #1b4d3e; text-align: right;">جدول الترتيب الصحيح:</h3>
        <table>
            <thead>
                <tr>
                    <th>المركز</th>
                    <th style="text-align: right;">الفريق</th>
                    <th>لعب</th>
                    <th>فاز</th>
                    <th>تعادل</th>
                    <th>خسر</th>
                    <th>النقاط</th>
                </tr>
            </thead>
            <tbody id="standingsTableBody"></tbody>
        </table>
    </div>

    <!-- قسم الهدافين الجديد -->
    <div id="scorersSection" class="section">
        <h3 style="color: #1b4d3e; text-align: right;">قائمة هدافي دوري روشن:</h3>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th style="text-align: right;">اللاعب</th>
                    <th style="text-align: right;">الفريق</th>
                    <th>الأهداف</th>
                </tr>
            </thead>
            <tbody id="scorersTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    function getTeamBadge(teamName) {
        if (teamName === "الهلال") return "هـ";
        if (teamName === "النصر") return "نـ";
        if (teamName === "الاتحاد") return "اتـ";
        if (teamName === "الأهلي") return "أهـ";
        if (teamName === "القادسية") return "قـ";
        if (teamName === "الشباب") return "شـ";
        if (teamName === "التعاون") return "تعـ";
        if (teamName === "الاتفاق") return "تفـ";
        if (teamName === "الفتح") return "فتـ";
        if (teamName === "الرياض") return "ريـ";
        return teamName.substring(0, 2);
    }

    function switchTab(tab) {
        ['yesterday', 'today', 'tomorrow', 'standings', 'scorers'].forEach(t => {
            document.getElementById(t + 'Section').classList.remove('active');
            document.getElementById('btn' + t.charAt(0).toUpperCase() + t.slice(1)).classList.remove('active');
        });
        document.getElementById(tab + 'Section').classList.add('active');
        document.getElementById('btn' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
    }

    const yesterdayData = [
        { home: "الأهلي", away: "الفتح", score: "2 - 1", type: "ended" },
        { home: "التعاون", away: "الشباب", score: "0 - 0", type: "ended" }
    ];

    const todayData = [
        { home: "القادسية", away: "الهلال", score: "1 - 1", type: "ended" },
        { home: "النصر", away: "الاتحاد", score: "VS", type: "ended" }
    ];

    const tomorrowDate = new Date();
    tomorrowDate.setDate(tomorrowDate.getDate() + 1);
    tomorrowDate.setHours(20, 0, 0, 0);

    const tomorrowData = [
        { home: "نيوم", away: "الدرعية", time: tomorrowDate, type: "upcoming" },
        { home: "الاتفاق", away: "الخلود", time: tomorrowDate, type: "upcoming" }
    ];

    const standingsData = [
        { rank: 1, team: "القادسية", played: 10, win: 8, draw: 1, lose: 1, points: 25 },
        { rank: 2, team: "الهلال", played: 9, win: 8, draw: 1, lose: 0, points: 24 },
        { rank: 3, team: "النصر", played: 9, win: 7, draw: 1, lose: 1, points: 22 },
        { rank: 4, team: "الاتحاد", played: 9, win: 6, draw: 2, lose: 1, points: 20 },
        { rank: 5, team: "الأهلي", played: 9, win: 6, draw: 3, lose: 0, points: 18 },
        { rank: 6, team: "نيوم", played: 10, win: 5, draw: 1, lose: 4, points: 16 },
        { rank: 7, team: "الدرعية", played: 10, win: 4, draw: 3, lose: 3, points: 15 },
        { rank: 8, team: "الاتفاق", played: 10, win: 4, draw: 3, lose: 3, points: 15 },
        { rank: 9, team: "الخلود", played: 9, win: 3, draw: 3, lose: 3, points: 12 },
        { rank: 10, team: "الخليج", played: 10, win: 2, draw: 6, lose: 2, points: 12 },
        { rank: 11, team: "الحزم", played: 10, win: 2, draw: 3, lose: 5, points: 9 },
        { rank: 12, team: "الرياض", played: 9, win: 2, draw: 3, lose: 4, points: 9 },
        { rank: 13, team: "الشباب", played: 9, win: 1, draw: 5, lose: 3, points: 8 },
        { rank: 14, team: "الفيصلي", played: 9, win: 1, draw: 4, lose: 4, points: 7 },
        { rank: 15, team: "الفيحاء", played: 10, win: 1, draw: 4, lose: 5, points: 7 },
        { rank: 16, team: "الفتح", played: 10, win: 1, draw: 3, lose: 6, points: 6 },
        { rank: 17, team: "التعاون", played: 10, win: 0, draw: 4, lose: 6, points: 4 },
        { rank: 18, team: "أبها", played: 8, win: 0, draw: 2, lose: 6, points: 2 }
    ];

    // بيانات الهدافين مأخوذة من صورتك بدقة
    const scorersData = [
        { rank: 1, player: "إيفان توني", team: "الأهلي", goals: 11 },
        { rank: 2, player: "ماتيوس ريتيغوي", team: "القادسية", goals: 6 },
        { rank: 3, player: "ألكسندر ميندي", team: "الفيصلي", goals: 5 },
        { rank: 4, player: "فرانسيسكو ترينتاو", team: "الأهلي", goals: 5 },
        { rank: 5, player: "ألكسندر لاكازيت", team: "نيوم", goals: 5 },
        { rank: 6, player: "ستيفن بيرغوين", team: "الاتحاد", goals: 5 },
        { rank: 7, player: "يوسف النصيري", team: "الاتحاد", goals: 5 },
        { rank: 8, player: "غابرييل مارتينيلي", team: "الهلال", goals: 5 },
        { rank: 9, player: "جوليان دومينغ", team: "الخلود", goals: 4 },
        { rank: 10, player: "كريستيانو رونالدو", team: "النصر", goals: 4 }
    ];

    function renderMatches(data, elementId) {
        const container = document.getElementById(elementId);
        container.innerHTML = '';
        if (data.length === 0) {
            container.innerHTML = `<div class="no-match">لا توجد مباريات مسجلة.</div>`;
            return;
        }
        data.forEach((m, index) => {
            const homeBadge = getTeamBadge(m.home);
            const awayBadge = getTeamBadge(m.away);

            if (m.type === 'ended') {
                container.innerHTML += `
                    <div class="match-card">
                        <div class="team-box">
                            <div class="team-badge">${homeBadge}</div>
                            <span class="team-name">${m.home}</span>
                        </div>
                        <div style="text-align: center;">
                            <span class="score-box">${m.score}</span>
                            <div class="match-date-badge">انتهت المباراة</div>
                        </div>
                        <div class="team-box">
                            <span class="team-name">${m.away}</span>
                            <div class="team-badge">${awayBadge}</div>
                        </div>
                    </div>`;
            } else {
                const uniqueId = `${elementId}-${index}`;
                container.innerHTML += `
                    <div class="match-card">
                        <div class="team-box">
                            <div class="team-badge">${homeBadge}</div>
                            <span class="team-name">${m.home}</span>
                        </div>
                        <div style="text-align: center;">
                            <div class="match-date-badge">الخميس، 22 أكتوبر 2026</div>
                            <div class="countdown-container" id="cd-${uniqueId}">
                                <div class="time-box"><span id="d-${uniqueId}">0</span>يوم</div>
                                <div class="time-separator">:</div>
                                <div class="time-box"><span id="h-${uniqueId}">00</span>ساعة</div>
                                <div class="time-separator">:</div>
                                <div class="time-box"><span id="m-${uniqueId}">00</span>دقيقة</div>
                                <div class="time-separator">:</div>
                                <div class="time-box"><span id="s-${uniqueId}">00</span>ثانية</div>
                            </div>
                        </div>
                        <div class="team-box">
                            <span class="team-name">${m.away}</span>
                            <div class="team-badge">${awayBadge}</div>
                        </div>
                    </div>`;
                startCountdown(m.time, uniqueId);
            }
        });
    }

    function startCountdown(targetDate, id) {
        setInterval(() => {
            const now = new Date();
            const diff = targetDate - now;
            if (diff <= 0) return;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);

            const dEl = document.getElementById(`d-${id}`);
            const hEl = document.getElementById(`h-${id}`);
            const mEl = document.getElementById(`m-${id}`);
            const sEl = document.getElementById(`s-${id}`);

            if (dEl) dEl.innerText = days;
            if (hEl) hEl.innerText = String(hours).padStart(2, '0');
            if (mEl) mEl.innerText = String(mins).padStart(2, '0');
            if (sEl) sEl.innerText = String(secs).padStart(2, '0');
        }, 1000);
    }

    renderMatches(yesterdayData, 'yesterdayList');
    renderMatches(todayData, 'todayList');
    renderMatches(tomorrowData, 'tomorrowList');

    // تعبئة جدول الترتيب
    const standingsTableBody = document.getElementById('standingsTableBody');
    standingsData.forEach(s => {
        const badge = getTeamBadge(s.team);
        standingsTableBody.innerHTML += `
            <tr>
                <td><strong>${s.rank}</strong></td>
                <td style="text-align: right;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <div class="team-badge">${badge}</div>
                        <strong style="color: #2c3e50;">${s.team}</strong>
                    </div>
                </td>
                <td>${s.played}</td>
                <td>${s.win}</td>
                <td>${s.draw}</td>
                <td>${s.lose}</td>
                <td><strong>${s.points}</strong></td>
            </tr>`;
    });

    // تعبئة جدول الهدافين
    const scorersTableBody = document.getElementById('scorersTableBody');
    scorersData.forEach(sc => {
        scorersTableBody.innerHTML += `
            <tr>
                <td><strong>${sc.rank}</strong></td>
                <td style="text-align: right; font-weight: bold; color: #2c3e50;">${sc.player}</td>
                <td style="text-align: right; color: #555;">${sc.team}</td>
                <td><strong style="color: #1b4d3e; font-size: 16px;">${sc.goals}</strong></td>
            </tr>`;
    });
</script>

</body>
</html>
