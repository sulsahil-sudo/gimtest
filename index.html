<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">
<title>دوري روشن السعودي - إحصائيات</title>
<style>
    .dark-mode, body {
        background: #121212 !important;
        color: #ffffff !important;
    }
    
    .content, 
    .match-card, 
    .stat-card, 
    .player-mini, 
    .match-mini,
    .modal-content {
        background: #1e1e1e !important;
        color: #ffffff !important;
        border-color: #2c2c2c !important;
    }
    
    .sticky-header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: #121212;
        padding: 15px 15px 10px;
        margin: 0 -15px 15px -15px;
        border-bottom: 1px solid #222;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', 'Tahoma', Arial, sans-serif; padding: 0 15px 80px; transition: background-color 0.3s, color 0.3s; }
    
    .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }
    .header-title-box {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 18px;
        font-weight: bold;
        color: #fff;
    }
    .header-title-box img {
        width: 28px;
        height: 28px;
        object-fit: contain;
    }
    .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .icon-btn {
        background: transparent;
        border: none;
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        padding: 4px;
    }

    .tabs-wrap { overflow-x: auto; margin-bottom: 0; }
    .tabs-wrap::-webkit-scrollbar { display: none; }
    .tabs { display: flex; gap: 20px; min-width: max-content; align-items: center; border-bottom: 1px solid #222; padding-bottom: 2px; }
    .tab { padding: 8px 4px; border: none; background: transparent; cursor: pointer; font-size: 15px; font-weight: bold; color: #888; font-family: inherit; white-space: nowrap; position: relative; }
    .tab.active { color: #fff; }
    .tab.active::after {
        content: '';
        position: absolute;
        bottom: -3px;
        right: 0;
        left: 0;
        height: 3px;
        background: #3498db;
        border-radius: 2px;
    }
    .tab.active-live { color: #e74c3c !important; }
    .tab.active-live::after { background: #e74c3c; }

    .content { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-top: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .hidden { display: none; }
    
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 500px; color: #fff; }
    th { color: #888; padding: 10px 6px; text-align: center; font-size: 12px; font-weight: normal; white-space: nowrap; border-bottom: 1px solid #2c2c2c; }
    td { padding: 10px 6px; text-align: center; border-bottom: 1px solid #222; font-size: 13px; }
    .team { text-align: right; font-weight: bold; }
    .team-logo { width: 24px; height: 24px; object-fit: contain; flex-shrink: 0; }

    .team-link {
        display: flex; align-items: center; gap: 8px; justify-content: flex-end;
        text-decoration: none; color: #fff; font-weight: bold;
        padding: 4px; border-radius: 6px; transition: 0.2s; cursor: pointer;
        border: none; background: transparent; font-family: inherit; font-size: 13px;
    }
    .team-link:hover { background: rgba(255,255,255,0.05); }

    .bottom-nav {
        position: fixed;
        bottom: 0;
        right: 0;
        left: 0;
        background: #181818;
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 8px 0;
        border-top: 1px solid #282828;
        z-index: 1000;
        box-shadow: 0 -4px 15px rgba(0,0,0,0.4);
    }
    .nav-item {
        background: transparent;
        border: none;
        color: #888;
        font-family: inherit;
        font-size: 11px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        flex: 1;
        transition: 0.2s;
    }
    .nav-item span.icon { font-size: 18px; }
    .nav-item.active { color: #3498db; }

    .loading, .empty { text-align: center; color: #888; padding: 40px; font-size: 14px; }
    
    .search-bar { margin-bottom: 15px; display: flex; gap: 8px; flex-wrap: wrap; }
    .search-bar input, .search-bar select { padding: 10px; border: 1px solid #333; background: #252525; color: #fff; border-radius: 8px; font-size: 13px; font-family: inherit; flex: 1; }
    
    .match-filters { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
    .filter-btn { padding: 6px 12px; border: 1px solid #333; background: #252525; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: bold; color: #aaa; font-family: inherit; white-space: nowrap; }
    .filter-btn.active { background: #3498db; color: white; border-color: #3498db; }

    .match-card { border: 1px solid #282828; border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #1e1e1e; }
    .match-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 11px; color: #888; }
    .match-status { background: rgba(52, 152, 219, 0.15); color: #3498db; padding: 2px 8px; border-radius: 6px; font-weight: bold; }
    .match-body { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .match-team-block { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 35%; cursor: pointer; border: none; background: transparent; font-family: inherit; color: #fff; }
    .match-team-logo { width: 40px; height: 40px; object-fit: contain; }
    .match-team { font-weight: bold; font-size: 13px; text-align: center; }
    .match-score { background: #3498db; color: white; padding: 8px 14px; border-radius: 8px; font-weight: bold; font-size: 18px; }

    .modal-overlay {
        position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
        z-index: 2000; display: flex; align-items: center; justify-content: center;
        padding: 15px; opacity: 0; visibility: hidden; transition: 0.3s;
    }
    .modal-overlay.open { opacity: 1; visibility: visible; }
    .modal-content {
        background: #1e1e1e; border-radius: 15px; max-width: 600px; width: 100%;
        max-height: 90vh; overflow-y: auto; padding: 20px; position: relative; color: #fff;
    }
    .modal-close {
        position: absolute; top: 12px; left: 12px;
        background: #e74c3c; color: white; border: none; border-radius: 50%;
        width: 30px; height: 30px; font-size: 16px; cursor: pointer;
    }
    .updated { text-align: center; color: #777; font-size: 11px; margin-top: 10px; }
    
    .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: #2a2a2a; color: #fff; font-weight: bold; font-size: 11px; }
    .rank-badge.gold { background: #f1c40f; color: #111; }
    .rank-badge.silver { background: #bdc3c7; color: #111; }
    .rank-badge.bronze { background: #d35400; color: #fff; }
    
    .player-name-cell { color: #3498db; font-weight: bold; }
</style>
</head>
<body class="dark-mode">

<div class="sticky-header">
  <div class="header-top">
    <div class="header-title-box">
      <img src="https://a.espncdn.com/i/teamlogos/soccer/500/929.png" alt="دوري روشن" onerror="this.style.display='none'">
      <span>دوري روشن السعودي</span>
    </div>
    <div class="header-actions">
      <!-- زر تبديل الوضع الداكن والفاتح (الدارك واللايت) -->
      <button class="icon-btn" onclick="toggleDarkMode()" id="themeToggleBtn" title="تبديل الوضع">☀️</button>
      <button class="icon-btn">🔔</button>
    </div>
  </div>

  <div class="tabs-wrap">
    <div class="tabs">
      <button class="tab active" onclick="switchMainTab('standings', this)" id="tabStandings">الترتيب</button>
      <button class="tab" onclick="switchMainTab('live', this)" id="tabLive" style="display:none;">🔴 ترتيب حي</button>
      <button class="tab" onclick="switchMainTab('results', this)" id="tabResults">المباريات</button>
      <button class="tab" onclick="switchMainTab('players', this)" id="tabPlayers">اللاعبون</button>
      <button class="tab" onclick="switchMainTab('scorers', this)" id="tabScorers">الهدافون</button>
      <button class="tab" onclick="switchMainTab('assists', this)" id="tabAssists">صناع الأهداف</button>
    </div>
  </div>
</div>

<div id="standings" class="content">
  <div class="table-wrap"><table>
    <thead><tr><th>#</th><th>الفريق</th><th>ل</th><th>ف</th><th>ت</th><th>خ</th><th>+/-</th><th>نقاط</th></tr></thead>
    <tbody id="standingsBody"><tr><td colspan="8" class="loading">جاري التحميل...</td></tr></tbody>
  </table></div>
  <div id="updatedStandings" class="updated"></div>
</div>

<div id="live" class="content hidden">
  <div class="table-wrap"><table>
    <thead><tr><th>#</th><th>الفريق</th><th>ل</th><th>ف</th><th>ت</th><th>خ</th><th>+/-</th><th>نقاط</th></tr></thead>
    <tbody id="liveBody"></tbody>
  </table></div>
</div>

<div id="players" class="content hidden">
  <div class="search-bar">
    <input type="text" id="playerSearch" placeholder="ابحث باسم اللاعب..." oninput="filterPlayers()">
    <select id="teamFilter" onchange="filterPlayers()"><option value="">كل الفرق</option></select>
  </div>
  <div class="table-wrap"><table>
    <thead><tr><th>#</th><th>اللاعب</th><th>الفريق</th><th>المركز</th></tr></thead>
    <tbody id="playersBody"><tr><td colspan="4" class="loading">جاري التحميل...</td></tr></tbody>
  </table></div>
</div>

<div id="scorers" class="content hidden">
  <div class="table-wrap"><table>
    <thead><tr><th>#</th><th>اللاعب</th><th>الفريق</th><th>الأهداف</th></tr></thead>
    <tbody id="scorersBody"><tr><td colspan="4" class="loading">جاري التحميل...</td></tr></tbody>
  </table></div>
</div>

<div id="assists" class="content hidden">
  <div class="table-wrap"><table>
    <thead><tr><th>#</th><th>اللاعب</th><th>الفريق</th><th>صناعة</th></tr></thead>
    <tbody id="assistsBody"><tr><td colspan="4" class="loading">جاري التحميل...</td></tr></tbody>
  </table></div>
</div>

<div id="results" class="content hidden">
  <div class="match-filters" id="matchFilters"></div>
  <div id="resultsData" class="loading">جاري التحميل...</div>
</div>

<nav class="bottom-nav">
  <button class="nav-item active" onclick="navClick('standings', this)">
    <span class="icon">⚽</span>
    <span>مباريات / ترتيب</span>
  </button>
  <button class="nav-item" onclick="navClick('scorers', this)">
    <span class="icon">❤️</span>
    <span>فرقي</span>
  </button>
  <button class="nav-item" onclick="navClick('players', this)">
    <span class="icon">🏆</span>
    <span>بطولات</span>
  </button>
  <button class="nav-item" onclick="navClick('results', this)">
    <span class="icon">📰</span>
    <span>أخبار</span>
  </button>
  <button class="nav-item" onclick="navClick('players', this)">
    <span class="icon">⋯</span>
    <span>المزيد</span>
  </button>
</nav>

<div class="modal-overlay" id="teamModal" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalInnerContent"></div>
  </div>
</div>

<script src="names.js"></script>
<script>
var teamLogos = {
  "الهلال": "https://a.espncdn.com/i/teamlogos/soccer/500/929.png",
  "الاتحاد": "https://a.espncdn.com/i/teamlogos/soccer/500/2276.png",
  "النصر": "https://a.espncdn.com/i/teamlogos/soccer/500/817.png",
  "القادسية": "https://a.espncdn.com/i/teamlogos/soccer/500/22022.png",
  "نيوم": "https://a.espncdn.com/i/teamlogos/soccer/500/130899.png",
  "الأهلي": "https://a.espncdn.com/i/teamlogos/soccer/500/8346.png",
  "الخلود": "https://a.espncdn.com/i/teamlogos/soccer/500/22028.png",
  "الدرعية": "https://a.espncdn.com/i/teamlogos/soccer/500/131746.png",
  "الاتفاق": "https://a.espncdn.com/i/teamlogos/soccer/500/8363.png",
  "الحزم": "https://a.espncdn.com/i/teamlogos/soccer/500/21964.png",
  "الرياض": "https://a.espncdn.com/i/teamlogos/soccer/500/21965.png",
  "الفيحاء": "https://a.espncdn.com/i/teamlogos/soccer/500/21827.png",
  "الخليج": "https://a.espncdn.com/i/teamlogos/soccer/500/21829.png",
  "الشباب": "https://a.espncdn.com/i/teamlogos/soccer/500/793.png",
  "الفتح": "https://a.espncdn.com/i/teamlogos/soccer/500/13033.png",
  "الفيصلي": "https://a.espncdn.com/i/teamlogos/soccer/500/21446.png",
  "التعاون": "https://a.espncdn.com/i/teamlogos/soccer/500/18459.png",
  "أبها": "https://a.espncdn.com/i/teamlogos/soccer/500/21833.png"
};

function translateName(name) {
  if (!name) return '';
  if (window.playerNames && Object.prototype.hasOwnProperty.call(window.playerNames, name)) {
    return window.playerNames[name];
  }
  return name;
}

function teamLogoHTML(teamName) {
  var logo = teamLogos[teamName];
  if (logo) {
    return '<img src="' + logo + '" alt="' + teamName + '" class="team-logo" onerror="this.style.display=\'none\'">';
  }
  return '';
}

function teamLinkHTML(teamName) {
  return '<button class="team-link" onclick="openTeamModal(\'' + teamName.replace(/'/g, "\\'") + '\')">' + teamName + teamLogoHTML(teamName) + '</button>';
}

function switchMainTab(id, btn) {
  document.querySelectorAll('.content').forEach(function(el) { el.classList.add('hidden'); });
  document.querySelectorAll('.tab').forEach(function(el) { el.classList.remove('active', 'active-live'); });
  document.getElementById(id).classList.remove('hidden');
  if (id === 'live') btn.classList.add('active-live'); else btn.classList.add('active');
}

function navClick(id, navBtn) {
  document.querySelectorAll('.nav-item').forEach(function(el) { el.classList.remove('active'); });
  navBtn.classList.add('active');
  if(id === 'standings') switchMainTab('standings', document.getElementById('tabStandings'));
  else if(id === 'scorers') switchMainTab('scorers', document.getElementById('tabScorers'));
  else if(id === 'players') switchMainTab('players', document.getElementById('tabPlayers'));
  else if(id === 'results') switchMainTab('results', document.getElementById('tabResults'));
}

var allMatches = [];
var allPlayers = [];
var originalStandings = [];
var currentFilter = 'today';

function loadData() {
  fetch('data.json?v=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      originalStandings = data.standings || [];
      var html = '';
      originalStandings.forEach(function(t) {
        var rankClass = 'rank-badge';
        if (t.r === 1) rankClass += ' gold';
        else if (t.r === 2) rankClass += ' silver';
        else if (t.r === 3) rankClass += ' bronze';
        
        html += '<tr>';
        html += '<td><span class="' + rankClass + '">' + t.r + '</span></td>';
        html += '<td class="team">' + teamLinkHTML(t.t) + '</td>';
        html += '<td>' + t.p + '</td>';
        html += '<td>' + t.w + '</td>';
        html += '<td>' + t.d + '</td>';
        html += '<td>' + t.l + '</td>';
        html += '<td>' + t.gd + '</td>';
        html += '<td><b>' + t.pts + '</b></td>';
        html += '</tr>';
      });
      document.getElementById('standingsBody').innerHTML = html;
      document.getElementById('updatedStandings').textContent = 'آخر تحديث: ' + data.lastUpdated;

      allPlayers = data.players || [];
      if (allPlayers.length > 0) {
        var teams = {};
        allPlayers.forEach(function(p) { if (p.team) teams[p.team] = true; });
        var teamSelect = document.getElementById('teamFilter');
        teamSelect.innerHTML = '<option value="">كل الفرق</option>';
        Object.keys(teams).sort().forEach(function(t) {
          var opt = document.createElement('option');
          opt.value = t; opt.textContent = t;
          teamSelect.appendChild(opt);
        });
        filterPlayers();
      }

      if (data.scorers) {
        var sHtml = '';
        data.scorers.forEach(function(s, i) {
          sHtml += '<tr><td>' + (i+1) + '</td><td class="player-name-cell">' + translateName(s.name) + '</td><td>' + s.team + '</td><td><b>' + s.goals + '</b></td></tr>';
        });
        document.getElementById('scorersBody').innerHTML = sHtml;
      }

      if (data.assists) {
        var aHtml = '';
        data.assists.forEach(function(a, i) {
          aHtml += '<tr><td>' + (i+1) + '</td><td class="player-name-cell">' + translateName(a.name) + '</td><td>' + a.team + '</td><td><b>' + a.assists + '</b></td></tr>';
        });
        document.getElementById('assistsBody').innerHTML = aHtml;
      }

      allMatches = data.results || [];
      buildFilters();
      renderMatches();
    })
    .catch(function(e) { console.log(e); });
}

function filterPlayers() {
  var search = document.getElementById('playerSearch').value.toLowerCase().trim();
  var team = document.getElementById('teamFilter').value;
  var filtered = allPlayers.filter(function(p) {
    var nameAr = translateName(p.name).toLowerCase();
    if (search && nameAr.indexOf(search) === -1) return false;
    if (team && p.team !== team) return false;
    return true;
  });
  var tb = document.getElementById('playersBody');
  if (filtered.length === 0) {
    tb.innerHTML = '<tr><td colspan="4" class="empty">لا توجد نتائج</td></tr>';
    return;
  }
  var html = '';
  filtered.forEach(function(p) {
    html += '<tr><td>' + (p.number || '—') + '</td><td class="player-name-cell">' + translateName(p.name) + '</td><td>' + p.team + '</td><td>' + (p.position || '—') + '</td></tr>';
  });
  tb.innerHTML = html;
}

function buildFilters() {
  var filters = [
    { id: 'all', label: 'الكل' },
    { id: 'today', label: 'اليوم' },
    { id: 'tomorrow', label: 'غداً' }
  ];
  var html = '';
  filters.forEach(function(f) {
    var active = currentFilter === f.id ? 'active' : '';
    html += '<button class="filter-btn ' + active + '" onclick="currentFilter=\'' + f.id + '\'; buildFilters(); renderMatches();">' + f.label + '</button>';
  });
  document.getElementById('matchFilters').innerHTML = html;
}

function renderMatches() {
  var rd = document.getElementById('resultsData');
  if (allMatches.length === 0) {
    rd.innerHTML = '<div class="empty">لا توجد مباريات</div>';
    return;
  }
  var html = '';
  allMatches.forEach(function(m) {
    html += '<div class="match-card">';
    html += '<div class="match-header"><span>موعد المباراة</span><span class="match-status">قادمة</span></div>';
    html += '<div class="match-body">';
    html += '<button class="match-team-block"><img src="' + (teamLogos[m.home]||'') + '" class="match-team-logo"><div class="match-team">' + m.home + '</div></button>';
    html += '<div class="match-score">VS</div>';
    html += '<button class="match-team-block"><img src="' + (teamLogos[m.away]||'') + '" class="match-team-logo"><div class="match-team">' + m.away + '</div></button>';
    html += '</div></div>';
  });
  rd.innerHTML = html;
}

function toggleDarkMode() {
  document.body.classList.toggle('dark-mode');
  var isDark = document.body.classList.contains('dark-mode');
  var btn = document.getElementById('themeToggleBtn');
  btn.textContent = isDark ? '☀️' : '🌙';
}

function openTeamModal(teamName) {
  var st = originalStandings.find(function(t) { return t.t === teamName; });
  var html = '<h2>' + teamName + '</h2>';
  if (st) {
    html += '<p>الترتيب: ' + st.r + ' | النقاط: ' + st.pts + '</p>';
  }
  document.getElementById('modalInnerContent').innerHTML = html;
  document.getElementById('teamModal').classList.add('open');
}

function closeModal(e) {
  if (e && e.target && e.target.id !== 'teamModal') return;
  document.getElementById('teamModal').classList.remove('open');
}

loadData();
</script>
</body>
</html>
