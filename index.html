<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دوري روشن السعودي - الموقع الرسمي</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 950px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1b4d3e; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 20px; font-size: 14px; }
        
        /* الأزرار */
        .nav-buttons { display: flex; justify-content: center; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; }
        .btn { background-color: #e0e0e0; color: #333; border: none; padding: 10px 18px; font-size: 14px; font-weight: bold; border-radius: 25px; cursor: pointer; transition: 0.3s; }
        .btn.active { background-color: #1b4d3e; color: white; box-shadow: 0 4px 10px rgba(27, 77, 62, 0.3); }
        .btn:hover { background-color: #14382c; color: white; }

        /* الأقسام */
        .section { display: none; }
        .section.active { display: block; }

        /* الجداول والبطاقات */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #e1e4e8; padding: 10px; text-align: center; font-size: 14px; }
        th { background-color: #1b4d3e; color: white; }
        tr:nth-child(even) { background-color: #f9fbfb; }
        tr:hover { background-color: #f1f5f5; }
        
        .match-card { background: #fdfefe; border: 1px solid #e1e4e8; border-radius: 8px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        
        /* شعارات الأندية والصور */
        .team-box { display: flex; align-items: center; justify-content: center; gap: 10px; width: 35%; }
        .team-logo { width: 40px; height: 40px; object-fit: contain; }
        .team-name { font-weight: bold; color: #1b4d3e; font-size: 15px; }
        
        .player-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #1b4d3e; }
        .player-info { display: flex; align-items: center; gap: 12px; }

        .score-box { font-size: 18px; font-weight: bold; color: #1b4d3e; background: #e8f5e9; padding: 5px 15px; border-radius: 20px; }
        .no-match { text-align: center; color: #666; padding: 20px; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <h1>⚽ دوري روشن السعودي للمحترفين</h1>
    <div class="subtitle">المباريات، الترتيب، الشعارات، وهدافو الدوري</div>

    <!-- الأزرار -->
    <div class="nav-buttons">
        <button id="btnYesterday" class="btn" onclick="switchTab('yesterday')">⏪ الأمس</button>
        <button id="btnToday" class="btn active" onclick="switchTab('today')">⚡ اليوم</button>
        <button id="btnTomorrow" class="btn" onclick="switchTab('tomorrow')">⏩ بكره</button>
        <button id="btnStandings" class="btn" onclick="switchTab('standings')">📊 الترتيب</button>
        <button id="btnScorers" class="btn" onclick="switchTab('scorers')">🏆 الهدافون</button>
    </div>

    <!-- الأقسام -->
    <div id="yesterdaySection" class="section">
        <h3 style="color: #1b4d3e; text-align: right;">مباريات الأمس:</h3>
        <div id="yesterdayList"></div>
    </div>

    <div id="todaySection" class="section active">
        <h3 style="color: #1b4d3e; text-align: right;">مباريات اليوم:</h3>
        <div id="todayList"></div>
    </div>

    <div id="tomorrowSection" class="section">
        <h3 style="color: #1b4d3e; text-align: right;">مباريات بكره:</h3>
        <div id="tomorrowList"></div>
    </div>

    <div id="standingsSection" class="section">
        <h3 style="color: #1b4d3e; text-align: right;">جدول الترتيب الصحيح:</h3>
        <table>
            <thead>
                <tr>
                    <th>المركز</th>
                    <th style="text-align: right;">الفريق</th>
                    <th>لعب</th>
                    <th>فاز</th>
                    <th>تعادل</th>
                    <th>خسر</th>
                    <th>النقاط</th>
                </tr>
            </thead>
            <tbody id="standingsTableBody"></tbody>
        </table>
    </div>

    <div id="scorersSection" class="section">
        <h3 style="color: #1b4d3e; text-align: right;">قائمة هدافي دوري روشن:</h3>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th style="text-align: right;">اللاعب</th>
                    <th style="text-align: right;">الفريق</th>
                    <th>الأهداف</th>
                </tr>
            </thead>
            <tbody id="scorersTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // روابط شعارات الأندية الرسمية
    const teamLogos = {
        "الهلال": "https://a.espncdn.com/i/teamlogos/soccer/500/4236.png",
        "النصر": "https://a.espncdn.com/i/teamlogos/soccer/500/4237.png",
        "الاتحاد": "https://a.espncdn.com/i/teamlogos/soccer/500/4238.png",
        "الأهلي": "https://a.espncdn.com/i/teamlogos/soccer/500/4235.png",
        "القادسية": "https://a.espncdn.com/i/teamlogos/soccer/500/21262.png",
        "الشباب": "https://a.espncdn.com/i/teamlogos/soccer/500/4240.png",
        "التعاون": "https://a.espncdn.com/i/teamlogos/soccer/500/13763.png",
        "الاتفاق": "https://a.espncdn.com/i/teamlogos/soccer/500/4239.png",
        "الفتح": "https://a.espncdn.com/i/teamlogos/soccer/500/13764.png",
        "الرياض": "https://a.espncdn.com/i/teamlogos/soccer/500/18883.png",
        "نيوم": "https://a.espncdn.com/i/teamlogos/soccer/500/default-team-logo-1.png",
        "الدرعية": "https://a.espncdn.com/i/teamlogos/soccer/500/default-team-logo-2.png",
        "الخلود": "https://a.espncdn.com/i/teamlogos/soccer/500/default-team-logo-3.png",
        "الخليج": "https://a.espncdn.com/i/teamlogos/soccer/500/18880.png",
        "الحزم": "https://a.espncdn.com/i/teamlogos/soccer/500/18879.png",
        "الفيصلي": "https://a.espncdn.com/i/teamlogos/soccer/500/18881.png",
        "الفيحاء": "https://a.espncdn.com/i/teamlogos/soccer/500/18882.png",
        "أبها": "https://a.espncdn.com/i/teamlogos/soccer/500/18878.png"
    };

    function getLogo(teamName) {
        return teamLogos[teamName] || "https://a.espncdn.com/i/teamlogos/soccer/500/default-team-logo-1.png";
    }

    function switchTab(tab) {
        ['yesterday', 'today', 'tomorrow', 'standings', 'scorers'].forEach(t => {
            document.getElementById(t + 'Section').classList.remove('active');
            document.getElementById('btn' + t.charAt(0).toUpperCase() + t.slice(1)).classList.remove('active');
        });
        document.getElementById(tab + 'Section').classList.add('active');
        document.getElementById('btn' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
    }

    const yesterdayData = [
        { home: "الأهلي", away: "الفتح", score: "2 - 1", type: "ended" },
        { home: "التعاون", away: "الشباب", score: "0 - 0", type: "ended" }
    ];

    const todayData = [
        { home: "القادسية", away: "الهلال", score: "1 - 1", type: "ended" },
        { home: "النصر", away: "الاتحاد", score: "VS", type: "ended" }
    ];

    const tomorrowData = [
        { home: "نيوم", away: "الدرعية", score: "VS", type: "upcoming" },
        { home: "الاتفاق", away: "الخلود", score: "VS", type: "upcoming" }
    ];

    const standingsData = [
        { rank: 1, team: "القادسية", played: 10, win: 8, draw: 1, lose: 1, points: 25 },
        { rank: 2, team: "الهلال", played: 9, win: 8, draw: 1, lose: 0, points: 24 },
        { rank: 3, team: "النصر", played: 9, win: 7, draw: 1, lose: 1, points: 22 },
        { rank: 4, team: "الاتحاد", played: 9, win: 6, draw: 2, lose: 1, points: 20 },
        { rank: 5, team: "الأهلي", played: 9, win: 6, draw: 3, lose: 0, points: 18 },
        { rank: 6, team: "نيوم", played: 10, win: 5, draw: 1, lose: 4, points: 16 },
        { rank: 7, team: "الدرعية", played: 10, win: 4, draw: 3, lose: 3, points: 15 },
        { rank: 8, team: "الاتفاق", played: 10, win: 4, draw: 3, lose: 3, points: 15 },
        { rank: 9, team: "الخلود", played: 9, win: 3, draw: 3, lose: 3, points: 12 },
        { rank: 10, team: "الخليج", played: 10, win: 2, draw: 6, lose: 2, points: 12 },
        { rank: 11, team: "الحزم", played: 10, win: 2, draw: 3, lose: 5, points: 9 },
        { rank: 12, team: "الرياض", played: 9, win: 2, draw: 3, lose: 4, points: 9 },
        { rank: 13, team: "الشباب", played: 9, win: 1, draw: 5, lose: 3, points: 8 },
        { rank: 14, team: "الفيصلي", played: 9, win: 1, draw: 4, lose: 4, points: 7 },
        { rank: 15, team: "الفيحاء", played: 10, win: 1, draw: 4, lose: 5, points: 7 },
        { rank: 16, team: "الفتح", played: 10, win: 1, draw: 3, lose: 6, points: 6 },
        { rank: 17, team: "التعاون", played: 10, win: 0, draw: 4, lose: 6, points: 4 },
        { rank: 18, team: "أبها", played: 8, win: 0, draw: 2, lose: 6, points: 2 }
    ];

    const scorersData = [
        { rank: 1, player: "إيفان توني", team: "الأهلي", goals: 11, img: "https://a.espncdn.com/i/headshots/soccer/players/full/158580.png" },
        { rank: 2, player: "ماتيوس ريتيغوي", team: "القادسية", goals: 6, img: "https://a.espncdn.com/i/headshots/soccer/players/full/304381.png" },
        { rank: 3, player: "ألكسندر ميندي", team: "الفيصلي", goals: 5, img: "https://a.espncdn.com/i/headshots/soccer/players/full/default.png" },
        { rank: 4, player: "ألكسندر لاكازيت", team: "نيوم", goals: 5, img: "https://a.espncdn.com/i/headshots/soccer/players/full/139955.png" },
        { rank: 5, player: "كريستيانو رونالدو", team: "النصر", goals: 4, img: "https://a.espncdn.com/i/headshots/soccer/players/full/3829.png" }
    ];

    function renderMatches(data, elementId) {
        const container = document.getElementById(elementId);
        container.innerHTML = '';
        data.forEach(m => {
            const homeLogo = getLogo(m.home);
            const awayLogo = getLogo(m.away);
            let scoreHTML = m.score === "VS" ? `<span class="score-box" style="background:#ecf0f1; color:#555;">VS</span>` : `<span class="score-box">${m.score}</span>`;

            container.innerHTML += `
                <div class="match-card">
                    <div class="team-box">
                        <img src="${homeLogo}" class="team-logo" alt="${m.home}">
                        <span class="team-name">${m.home}</span>
                    </div>
                    <div style="text-align: center;">
                        ${scoreHTML}
                        <div style="font-size: 11px; color: #e67e22; margin-top: 5px; font-weight: bold;">التفاصيل</div>
                    </div>
                    <div class="team-box">
                        <span class="team-name">${m.away}</span>
                        <img src="${awayLogo}" class="team-logo" alt="${m.away}">
                    </div>
                </div>`;
        });
    }

    renderMatches(yesterdayData, 'yesterdayList');
    renderMatches(todayData, 'todayList');
    renderMatches(tomorrowData, 'tomorrowList');

    const standingsTableBody = document.getElementById('standingsTableBody');
    standingsData.forEach(s => {
        const logo = getLogo(s.team);
        standingsTableBody.innerHTML += `
            <tr>
                <td><strong>${s.rank}</strong></td>
                <td style="text-align: right;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <img src="${logo}" class="team-logo" alt="${s.team}">
                        <strong style="color: #2c3e50;">${s.team}</strong>
                    </div>
                </td>
                <td>${s.played}</td>
                <td>${s.win}</td>
                <td>${s.draw}</td>
                <td>${s.lose}</td>
                <td><strong>${s.points}</strong></td>
            </tr>`;
    });

    const scorersTableBody = document.getElementById('scorersTableBody');
    scorersData.forEach(sc => {
        scorersTableBody.innerHTML += `
            <tr>
                <td><strong>${sc.rank}</strong></td>
                <td style="text-align: right;">
                    <div class="player-info">
                        <img src="${sc.img}" class="player-img" alt="${sc.player}">
                        <strong style="color: #2c3e50;">${sc.player}</strong>
                    </div>
                </td>
                <td style="text-align: right; color: #555; font-weight: bold;">${sc.team}</td>
                <td><strong style="color: #1b4d3e; font-size: 16px;">${sc.goals}</strong></td>
            </tr>`;
    });
</script>

</body>
</html>
